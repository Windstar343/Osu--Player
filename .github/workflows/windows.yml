name: Build Windows app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Rust and pnpm
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          npm install -g pnpm@11.25.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-release-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate frontend
        run: pnpm build
      - name: Build Windows application and installer
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=/source --remap-path-prefix=$env:USERPROFILE=/builder"
          pnpm tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
          New-Item -ItemType Directory -Path release-files -Force | Out-Null
          Copy-Item src-tauri/target/release/osu-player.exe release-files/Osu-Player-portable.exe
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Copy-Item -Destination release-files
          Copy-Item LICENSE,NOTICE release-files
          Get-ChildItem release-files/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release-files/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: osu-player-windows
          path: release-files/*
          if-no-files-found: error
